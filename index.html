<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Главные ключевые слова и описание для Google -->
    <title>KARTAL - Официальный сайт</title>
    <meta name="description" content="Добро пожаловать на персональный сайт проекта KARTAL. Узнайте больше здесь.">
    <meta name="keywords" content="KARTAL, картал, мой сайт, проект">
    
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>KARTAL</h1>
        <p>Добро пожаловать на мой сайт!</p>

        <!-- Контейнер для QR-кода (если он вам еще нужен, можно оставить) -->
        <div id="qrcode"></div>
    </div>

    <!-- Подключаем библиотеку для генерации QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Сюда можно вставить вашу новую ссылку с GitHub Pages, когда она появится!
        new QRCode(document.getElementById("qrcode"), {
            text: "https://hojaumyt9-pixel.github.io/my-site/",
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>

</body>
</html>
