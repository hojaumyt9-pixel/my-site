<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umyt07 - Цифровая визитка</title>
    <meta name="description" content="Официальная цифровая визитка Umyt07. Сохраните мой контакт в один клик.">
    <meta name="keywords" content="Umyt07, визитка, контакты, vCard">
    
    <!-- Подключаем стили и иконки -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- СТРАНИЦА 1: Только QR-код для сохранения контакта -->
    <div id="page-qr" class="card active-screen">
        <p class="title-top">Сканируйте для сохранения</p>
        <div class="qr-box" onclick="goToCard()">
            <div id="qrcode"></div>
        </div>
        <p class="hint-text">Наведите камеру, чтобы сохранить контакт</p>
        <button class="btn-next" onclick="goToCard()">Открыть контакты <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- СТРАНИЦА 2: Обычная визитка с кнопками для интернета -->
    <div id="page-card" class="card hidden-screen">
        <h1>Umyt07</h1>
        <p class="subtitle">Цифровая визитка</p>

        <!-- Кнопки с вашими контактами -->
        <div class="links-container">
            <!-- Telegram -->
            <a href="https://t.me/Kartal000007" target="_blank" class="btn-link">
                <i class="fa-brands fa-telegram"></i> Telegram
            </a>
            
            <!-- Instagram -->
            <a href="https://instagram.com/ka.rtal8425" target="_blank" class="btn-link">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            
            <!-- Телефон -->
            <a href="tel:+375256614012" class="btn-link">
                <i class="fa-solid fa-phone"></i> Позвонить
            </a>
            
            <!-- Почта -->
            <a href="mailto:hojaumyt9@gmail.com" class="btn-link">
                <i class="fa-solid fa-envelope"></i> Написать на почту
            </a>
        </div>

        <button class="btn-back" onclick="goToQr()"><i class="fa-solid fa-arrow-left"></i> Назад к QR-коду</button>
    </div>

    <!-- Библиотека для генерации QR-кода и логика переключения страниц -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Текст для QR-кода в формате vCard (сохраняет контакт без интернета)
        const vCardData = 
`BEGIN:VCARD
VERSION:3.0
FN:Umyt07
TEL:+375256614012
EMAIL:hojaumyt9@gmail.com
NOTE:Telegram: t.me/Kartal000007 | Instagram: @ka.rtal8425
END:VCARD`;

        // Генерируем QR-код с контактными данными
        new QRCode(document.getElementById("qrcode"), {
            text: vCardData,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // Функции переключения между экранами
        function goToCard() {
            document.getElementById('page-qr').classList.remove('active-screen');
            document.getElementById('page-qr').classList.add('hidden-screen');
            
            document.getElementById('page-card').classList.remove('hidden-screen');
            document.getElementById('page-card').classList.add('active-screen');
        }

        function goToQr() {
            document.getElementById('page-card').classList.remove('active-screen');
            document.getElementById('page-card').classList.add('hidden-screen');
            
            document.getElementById('page-qr').classList.remove('hidden-screen');
            document.getElementById('page-qr').classList.add('active-screen');
        }
    </script>

</body>
</html>
