<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Lite Messenger</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }

    .app-container { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; height: 85vh; max-height: 800px; border: 1px solid var(--border); }

    header { padding: 15px 20px; background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
    .status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: rgba(34, 197, 94, 0.15); color: var(--success); font-weight: 500; }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 15px; }
    .screen.active { display: flex; }

    .my-id-box { background: var(--bg-color); padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .my-id-box span { font-size: 0.8rem; color: var(--text-muted); }

    .add-contact-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input, select { flex: 1; background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .contacts-list { display: flex; flex-direction: column; gap: 10px; }
    .contact-card { background: var(--bg-color); padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .contact-info h3 { font-size: 0.95rem; margin-bottom: 3px; }
    .contact-info p { font-size: 0.8rem; color: var(--text-muted); }
    .contact-actions { display: flex; gap: 6px; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; }
    .icon-btn:hover { background: var(--accent); border-color: var(--accent); }

    /* Окно чата */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding-right: 5px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; word-break: break-word; }
    .message.incoming { background: var(--bg-color); border: 1px solid var(--border); align-self: flex-start; }
    .message.outgoing { background: var(--accent); color: white; align-self: flex-end; }
    .chat-input-box { display: flex; gap: 8px; }

    /* Экран звонка */
    .call-screen { position: relative; flex: 1; background: #000; border-radius: 14px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { position: absolute; bottom: 15px; right: 15px; width: 90px; height: 130px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); background: #222; }
    
    .call-controls { position: absolute; bottom: 20px; display: flex; gap: 15px; z-index: 10; }
    .call-btn { width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .btn-hangup { background: var(--danger); }

    .photo-section { margin-top: auto; background: var(--bg-color); padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    #photoPreview { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 10px; display: none; }
    
    nav { display: flex; background: rgba(30, 41, 59, 0.9); border-top: 1px solid var(--border); }
    .nav-item { flex: 1; text-align: center; padding: 12px; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; font-weight: 500; }
    .nav-item.active { color: var(--accent); border-top: 2px solid var(--accent); }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🌍 Global Lite</h1>
    <div class="status-badge" id="netStatus">Подключение...</div>
  </header>

  <!-- ВКЛАДКА 1: КОНТАКТЫ -->
  <div id="tab-contacts" class="screen active">
    <div class="my-id-box">
      <span>Мой ID:</span>
      <input type="text" id="myIdInput" placeholder="Ваш ID...">
      <button class="btn" id="saveIdBtn" style="padding: 6px 12px; font-size: 0.8rem;">ОК</button>
    </div>

    <div class="add-contact-box">
      <input type="text" id="contactName" placeholder="Имя абонента...">
      <input type="text" id="contactId" placeholder="Его ID в сети...">
      <button class="btn" id="addBtn">Добавить</button>
    </div>
    <div class="contacts-list" id="contactsList"></div>
  </div>

  <!-- ВКЛАДКА 2: ЧАТ -->
  <div id="tab-chat" class="screen">
    <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
      <h3 id="chatTitle" style="font-size: 0.95rem; color: var(--accent);">Выберите контакт</h3>
      <button class="btn" id="callFromChatBtn" style="padding: 6px 12px; font-size: 0.8rem; display: none;" onclick="startCallActiveContact()">📹 Видео</button>
    </div>
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <p style="text-align:center; color: var(--text-muted); font-size: 0.85rem; margin-top: 20px;">Выберите контакт из списка, чтобы написать сообщение</p>
      </div>
      <div class="chat-input-box">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
        <button class="btn" id="sendMsgBtn" disabled>➤</button>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: ЗВОНОК -->
  <div id="tab-call" class="screen">
    <div class="call-screen">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      
      <div class="call-controls">
        <button class="call-btn btn-hangup" id="hangupCall" title="Сбросить">❌</button>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 4: ФОТО -->
  <div id="tab-photo" class="screen">
    <div style="text-align: center; margin-bottom: 15px;">
      <h3 style="font-size: 1rem; margin-bottom: 5px;">Экономия трафика</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Фото сжимается перед отправкой</p>
    </div>
    <div class="photo-section">
      <label for="photoInput" class="btn" style="display: block; cursor: pointer;">📁 Выбрать фото</label>
      <input type="file" id="photoInput" accept="image/*" style="display: none;">
      <div id="photoStats" style="font-size: 0.8rem; margin-top: 8px; color: var(--text-muted);"></div>
      <img id="photoPreview" alt="Предпросмотр">
    </div>
  </div>

  <nav>
    <div class="nav-item active" onclick="switchTab('contacts', this)">👥 Контакты</div>
    <div class="nav-item" onclick="switchTab('chat', this)">💬 Чат</div>
    <div class="nav-item" onclick="switchTab('call', this)">📞 Связь</div>
    <div class="nav-item" onclick="switchTab('photo', this)">📷 Фото</div>
  </nav>
</div>

<script>
  function switchTab(tabName, element) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    element.classList.add('active');
  }

  let myId = localStorage.getItem('lite_my_id') || ('user_' + Math.floor(Math.random() * 1000));
  document.getElementById('myIdInput').value = myId;

  document.getElementById('saveIdBtn').onclick = () => {
    const val = document.getElementById('myIdInput').value.trim();
    if (val) {
      myId = val;
      localStorage.setItem('lite_my_id', myId);
      alert('Ваш ID сохранен: ' + myId);
      connectSignalingServer();
    }
  };

  let contacts = JSON.parse(localStorage.getItem('lite_contacts')) || [];
  let activeChatId = null;
  let activeChatName = '';

  const contactsListEl = document.getElementById('contactsList');
  const contactNameInput = document.getElementById('contactName');
  const contactIdInput = document.getElementById('contactId');

  function renderContacts() {
    contactsListEl.innerHTML = '';
    if (contacts.length === 0) {
      contactsListEl.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size: 0.85rem; margin-top: 20px;">Нет контактов. Добавьте ID друга!</p>';
      return;
    }
    contacts.forEach((c, index) => {
      const card = document.createElement('div');
      card.className = 'contact-card';
      card.innerHTML = `
        <div class="contact-info">
          <h3>${c.name}</h3>
          <p>ID: ${c.id}</p>
        </div>
        <div class="contact-actions">
          <button class="icon-btn" onclick="openChat('${c.id}', '${c.name}')" title="Чат">💬</button>
          <button class="icon-btn" onclick="callContact('${c.id}')" title="Звонок">📹</button>
          <button class="icon-btn" onclick="deleteContact(${index})" title="Удалить">🗑️</button>
        </div>
      `;
      contactsListEl.appendChild(card);
    });
  }

  document.getElementById('addBtn').onclick = () => {
    const name = contactNameInput.value.trim();
    const id = contactIdInput.value.trim();
    if (!name || !id) return alert('Заполните имя и ID!');
    contacts.push({ name, id });
    localStorage.setItem('lite_contacts', JSON.stringify(contacts));
    contactNameInput.value = '';
    contactIdInput.value = '';
    renderContacts();
  };

  function deleteContact(index) {
    contacts.splice(index, 1);
    localStorage.setItem('lite_contacts', JSON.stringify(contacts));
    renderContacts();
  }
  renderContacts();

  function openChat(id, name) {
    activeChatId = id;
    activeChatName = name;
    document.getElementById('chatTitle').innerText = `Чат с: ${name} (${id})`;
    document.getElementById('callFromChatBtn').style.display = 'block';
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendMsgBtn').disabled = false;
    
    loadChatMessages();
    switchTab('chat', document.querySelectorAll('.nav-item')[1]);
  }

  function loadChatMessages() {
    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = '';
    let history = JSON.parse(localStorage.getItem('chat_' + activeChatId)) || [];
    if (history.length === 0) {
      chatMessages.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">Нет сообщений. Напишите первое!</p>';
      return;
    }
    history.forEach(m => {
      appendMessageUI(m.text, m.sender === 'me' ? 'outgoing' : 'incoming');
    });
  }

  function appendMessageUI(text, type) {
    const chatMessages = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.innerText = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function saveAndAppendMessage(text, type, targetId) {
    let storageKey = 'chat_' + targetId;
    let history = JSON.parse(localStorage.getItem(storageKey)) || [];
    history.push({ text, sender: type === 'outgoing' ? 'me' : 'them' });
    localStorage.setItem(storageKey, JSON.stringify(history));
    if (activeChatId === targetId) {
      appendMessageUI(text, type);
    }
  }

  document.getElementById('sendMsgBtn').onclick = sendMessage;
  document.getElementById('messageInput').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !activeChatId) return;

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ targetId: activeChatId, chatMessage: text }));
      saveAndAppendMessage(text, 'outgoing', activeChatId);
      input.value = '';
    } else {
      alert('Нет подключения к серверу! Подождите соединение...');
    }
  }

  function startCallActiveContact() {
    if (activeChatId) callContact(activeChatId);
  }

  // WebSocket и WebRTC логика
  const wsUrl = 'wss://lite-signaling-server.onrender.com';
  let ws;
  let pc;
  let localStream;
  let pingInterval;
  
  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const netStatus = document.getElementById('netStatus');
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function connectSignalingServer() {
    if (ws) ws.close();
    if (pingInterval) clearInterval(pingInterval);

    netStatus.innerText = "Подключение...";
    netStatus.style.color = "var(--text-muted)";

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      netStatus.innerText = "В сети";
      netStatus.style.color = "var(--success)";
      ws.send(JSON.stringify({ type: 'register', id: myId }));

      // Каждые 20 секунд шлем пинг, чтобы не засыпало соединение
      pingInterval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping' }));
        }
      }, 20000);
    };

    ws.onclose = () => {
      netStatus.innerText = "Офлайн";
      netStatus.style.color = "var(--danger)";
      if (pingInterval) clearInterval(pingInterval);
      setTimeout(connectSignalingServer, 3000);
    };

    ws.onerror = () => {
      ws.close();
    };

    ws.onmessage = async (event) => {
      let message;
      try { message = JSON.parse(event.data); } catch (e) { return; }

      if (message.type === 'pong') return;

      if (message.chatMessage) {
        saveAndAppendMessage(message.chatMessage, 'incoming', message.senderId);
        return;
      }

      if (!pc) createPeerConnection(message.senderId);

      if (message.offer) {
        switchTab('call', document.querySelectorAll('.nav-item')[2]);
        await pc.setRemoteDescription(new RTCSessionDescription(message.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ targetId: message.senderId, answer: answer }));
      } else if (message.answer) {
        await pc.setRemoteDescription(new RTCSessionDescription(message.answer));
      } else if (message.candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
        } catch (e) { console.error(e); }
      }
    };
  }

  function createPeerConnection(targetId) {
    pc = new RTCPeerConnection(rtcConfig);
    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }
    pc.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };
    pc.onicecandidate = (event) => {
      if (event.candidate) ws.send(JSON.stringify({ targetId: targetId, candidate: event.candidate }));
    };
  }

  async function callContact(targetId) {
    switchTab('call', document.querySelectorAll('.nav-item')[2]);
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { max: 15 } }
      });
      localVideo.srcObject = localStream;
      createPeerConnection(targetId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ targetId: targetId, offer: offer }));
      netStatus.innerText = "Вызов...";
    } catch (err) {
      alert("Ошибка камеры/микрофона: " + err.message);
    }
  }

  document.getElementById('hangupCall').onclick = () => {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (pc) pc.close();
    pc = null;
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    netStatus.innerText = "В сети";
    netStatus.style.color = "var(--success)";
    switchTab('contacts', document.querySelectorAll('.nav-item')[0]);
  };

  connectSignalingServer();
</script>
</body>
</html>
